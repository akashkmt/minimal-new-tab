<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Settings panel -->
    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-header">
        <span>Settings</span>
        <button class="settings-close" id="settingsClose">✕</button>
      </div>

      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div class="segmented" id="themeSegmented">
          <button class="seg-btn" data-value="light">Light</button>
          <button class="seg-btn" data-value="dark">Dark</button>
          <button class="seg-btn active" data-value="system">System</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Time Format</div>
        <div class="segmented" id="formatSegmented">
          <button class="seg-btn" data-value="12">12h</button>
          <button class="seg-btn active" data-value="24">24h</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Search Engine</div>
        <div class="segmented" id="searchSegmented">
          <button class="seg-btn active" data-value="https://google.com/search?q=">Google</button>
          <button class="seg-btn" data-value="https://duckduckgo.com/?q=">DDG</button>
          <button class="seg-btn" data-value="https://bing.com/search?q=">Bing</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Quick Links</div>
        <div class="links-editor" id="linksEditor"></div>
        <button class="add-link-btn" id="addLinkBtn">+ Add link</button>
      </div>

      <div class="settings-section">
        <div class="settings-label">Top Widget</div>
        <div class="segmented" id="widgetSegmented">
          <button class="seg-btn active" data-value="progress">Day %</button>
          <button class="seg-btn" data-value="quote">Quote</button>
          <button class="seg-btn" data-value="week">Week</button>
          <button class="seg-btn" data-value="none">None</button>
        </div>
      </div>

      <div class="settings-section" id="nameSection">
        <div class="settings-label">Name (for greeting)</div>
        <input class="settings-input" id="nameInput" type="text" placeholder="Your name" maxlength="32" />
      </div>
    </div>

    <!-- Main content -->
    <div class="page" id="page">
      <button class="gear-btn" id="gearBtn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>

      <div class="main">
        <div class="top-widget" id="topWidget"></div>

        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date"></div>

        <div class="weather" id="weather">
          <span class="weather-icon" id="weatherIcon"></span>
          <span class="weather-text" id="weatherText"></span>
          <span class="weather-loc" id="weatherLoc"></span>
        </div>

        <form class="search-bar" id="searchForm" autocomplete="off">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="search-input" id="searchInput" type="text" placeholder="Search..." spellcheck="false" />
        </form>

        <div class="quick-links" id="quickLinks"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
